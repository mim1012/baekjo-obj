name: golden-crud (localhost isolated staging)

on:
  workflow_dispatch:
    inputs:
      allow_localhost_staging_write:
        description: 'localhost 앱과 승인된 staging ref에서 write QA를 실행함'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  GOLDEN_CRUD_API_PATHS: |
    src/app/api/admin/brands/
    src/app/api/admin/category-settings/
    src/app/api/admin/concerns/
    src/app/api/admin/inquiries/
    src/app/api/admin/insurance/
    src/app/api/admin/insurance-content/
    src/app/api/admin/kits/
    src/app/api/admin/members/
    src/app/api/admin/notices/
    src/app/api/admin/order-policy/
    src/app/api/admin/orders/
    src/app/api/admin/partner-inquiries/
    src/app/api/admin/products/
    src/app/api/admin/product-tags/
    src/app/api/admin/reviews/
    src/app/api/admin/settings/
    src/app/api/admin/showcase-reviews/
    src/app/api/admin/survey/
  GOLDEN_CRUD_SPECS: |
    admin-crud-brand-fields.spec.ts
    admin-crud-brands.spec.ts
    admin-crud-category-settings.spec.ts
    admin-crud-cms-page-publish.spec.ts
    admin-crud-concerns.spec.ts
    admin-crud-home-settings.spec.ts
    admin-crud-insurance.spec.ts
    admin-crud-insurance-cert.spec.ts
    admin-crud-insurance-content.spec.ts
    admin-crud-kits.spec.ts
    admin-crud-members.spec.ts
    admin-crud-members-pending-signup.spec.ts
    admin-crud-notices.spec.ts
    admin-crud-order-policy.spec.ts
    admin-crud-orders.spec.ts
    admin-crud-order-shipments.spec.ts
    admin-crud-partner-inquiries.spec.ts
    admin-crud-product-fields.spec.ts
    admin-crud-product-gallery-removal.spec.ts
    admin-crud-products.spec.ts
    admin-crud-product-tags.spec.ts
    admin-crud-qna-inquiries.spec.ts
    admin-crud-reviews-moderation.spec.ts
    admin-crud-showcase-reviews.spec.ts
    admin-crud-survey.spec.ts
    member-admin-edit-propagation.spec.ts
    member-card-payment-boundary.spec.ts
    member-diagnosis.spec.ts
    member-inquiry-edit-save.spec.ts
    member-order-journey.spec.ts
    member-password-change.spec.ts
    member-profile.spec.ts
    member-review-inquiry.spec.ts
    member-social-login-contract.spec.ts
    member-wishlist.spec.ts

concurrency:
  group: golden-crud-localhost-staging
  cancel-in-progress: false

jobs:
  localhost-write-validation:
    if: ${{ inputs.allow_localhost_staging_write == true }}
    runs-on: ubuntu-latest
    env:
      CI: '1'
      E2E_BASE_URL: 'http://127.0.0.1:3000'
      PAYMENTS_PREVIEW_URL: 'http://127.0.0.1:3000'
      E2E_ADMIN_CRUD: '1'
      LOCAL_APP_RUNTIME_SUPABASE_PREFLIGHT: '1'
      SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_SECRET_KEY: ${{ secrets.STAGING_SUPABASE_SECRET_KEY }}
      TEST_SUPABASE_PROJECT_REF: ${{ secrets.TEST_SUPABASE_PROJECT_REF }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_MEMBER_EMAIL: ${{ secrets.E2E_MEMBER_EMAIL }}
      E2E_MEMBER_PASSWORD: ${{ secrets.E2E_MEMBER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Fail closed on missing isolated staging configuration
        run: |
          test -n "$TEST_SUPABASE_PROJECT_REF" || exit 1
          test -n "$SUPABASE_URL" || exit 1
          test -n "$SUPABASE_ACCESS_TOKEN" || exit 1
          test -n "$SUPABASE_SECRET_KEY" || exit 1
          actual_ref=$(node -e "const u=new URL(process.env.SUPABASE_URL); const m=/^([a-z0-9]{20})\.supabase\.co$/.exec(u.hostname.toLowerCase()); if(!m) process.exit(1); process.stdout.write(m[1])")
          test "$actual_ref" = "$TEST_SUPABASE_PROJECT_REF" || exit 1
      - name: Apply migrations to isolated staging and verify CMS connection
        run: node scripts/apply-migrations.mjs
      - name: Start localhost app
        run: |
          npm run dev > "$RUNNER_TEMP/local-app.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/local-app.pid"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/test/supabase-ref > "$RUNNER_TEMP/runtime-ref.json"; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: App runtime staging ref preflight
        run: |
          runtime_ref=$(node -e "const fs=require('node:fs'); const value=JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); if(typeof value.projectRef!=='string') process.exit(1); process.stdout.write(value.projectRef)" "$RUNNER_TEMP/runtime-ref.json")
          if [ "$runtime_ref" != "$TEST_SUPABASE_PROJECT_REF" ]; then exit 1; fi
      - name: Validate golden coverage manifest
        run: |
          test -n "$GOLDEN_CRUD_API_PATHS"
          test -n "$GOLDEN_CRUD_SPECS"
      - name: Golden CRUD and storage write validation
        run: npx playwright test --project=golden-crud --workers=1 --retries=0 --reporter=line
      - name: Payment order and confirm write validation
        run: npx playwright test --project=payments tests/payments/payment-routes.spec.ts --workers=1 --retries=0 --reporter=line
      - name: Upload failure artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: localhost-write-validation-failure
          path: |
            test-results/
            ${{ runner.temp }}/local-app.log
          retention-days: 7
