name: production-release (tag and GitHub Release)

on:
  deployment_status:

permissions:
  contents: write

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  tag-production:
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment == 'Production'
    runs-on: ubuntu-latest
    steps:
      - name: Check out deployed commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify deployment is the current main commit
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYED_SHA: ${{ github.event.deployment.sha }}
        run: |
          set -euo pipefail
          main_sha=$(gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq '.object.sha')
          test "$DEPLOYED_SHA" = "$main_sha"
          echo "sha=$DEPLOYED_SHA" >> "$GITHUB_OUTPUT"

      - name: Create an idempotent release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.verify.outputs.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          version="$(node -p "require('./package.json').version")"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "package.json version must be stable semver MAJOR.MINOR.PATCH: $version" >&2
            exit 1
          fi
          base_tag="v$version"
          release_title="$base_tag · 업데이트 및 버그 수정"
          existing_tag=""
          while read -r candidate; do
            existing_sha=$(git rev-list -n 1 "$candidate")
            if [ "$existing_sha" = "$RELEASE_SHA" ]; then
              existing_tag="$candidate"
              break
            fi
          done < <(git for-each-ref --format='%(refname:strip=2)' refs/tags)
          if [ -n "$existing_tag" ]; then
            echo "tag=$existing_tag" >> "$GITHUB_OUTPUT"
            echo "title=$existing_tag · 업데이트 및 버그 수정" >> "$GITHUB_OUTPUT"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git show-ref --verify --quiet "refs/tags/$base_tag"; then
            existing_sha=$(git rev-list -n 1 "$base_tag")
            echo "Release tag $base_tag already points to $existing_sha; bump package.json version before deploying $RELEASE_SHA." >&2
            exit 1
          fi
          git tag -a "$base_tag" "$RELEASE_SHA" -m "Production release $base_tag"
          git push origin "$base_tag"
          echo "tag=$base_tag" >> "$GITHUB_OUTPUT"
          echo "title=$release_title" >> "$GITHUB_OUTPUT"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          RELEASE_TITLE: ${{ steps.tag.outputs.title }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 && exit 0
          gh release create "$RELEASE_TAG" --title "$RELEASE_TITLE" --generate-notes --target "${{ steps.verify.outputs.sha }}"
