name: release-qa (Preview read-only)

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: '명시 승인된 Preview URL'
        required: true
        type: string
      allow_preview_readonly:
        description: 'Preview 읽기 전용 release QA 비용을 승인함'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release-qa:
    if: ${{ inputs.allow_preview_readonly == true }}
    runs-on: ubuntu-latest
    env:
      TARGET_URL: ${{ inputs.target_url }}
      PREVIEW_QA_ACK: '1'
      MAX_TOP_LEVEL_NAVIGATIONS: '5'
      MAX_ROUTE_CALLS: '5'
      PLAYWRIGHT_WORKERS: '1'
      PLAYWRIGHT_RETRIES: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Preview target and budget guard
        run: |
          test "$PREVIEW_QA_ACK" = "1" || exit 1
          budget="$MAX_TOP_LEVEL_NAVIGATIONS"
          echo "$budget" | grep -qE '^[0-9]+$' || exit 1
          if [ "$budget" -gt 5 ]; then exit 1; fi
          test "$MAX_ROUTE_CALLS" = "5" || exit 1
          test "$PLAYWRIGHT_WORKERS" = "1" || exit 1
          test "$PLAYWRIGHT_RETRIES" = "0" || exit 1
          host=$(node -e "const u=new URL(process.env.TARGET_URL); if(u.protocol!=='https:') process.exit(1); process.stdout.write(u.hostname.toLowerCase())")
          if echo "$host" | grep -qiE 'baekjo-obj\.vercel\.app|(www\.)?baekjo-objet\.com'; then exit 1; fi
      - name: Install
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Enforce selected route budget
        env:
          E2E_BASE_URL: ${{ inputs.target_url }}
        run: |
          budget="$MAX_TOP_LEVEL_NAVIGATIONS"
          selected=$(npx playwright test tests/golden/visual.spec.ts --project=chromium --grep 'desktop.*(#1|#2|#3|#4|#5)' --list | grep -c '›')
          if [ "$selected" -gt "$budget" ]; then exit 1; fi
          test "$selected" -eq 5 || exit 1
      - name: Release read-only route smoke
        run: npx playwright test tests/golden/visual.spec.ts --project=chromium --grep 'desktop.*(#1|#2|#3|#4|#5)' --workers=1 --retries=0 --reporter=line
        env:
          E2E_BASE_URL: ${{ inputs.target_url }}
          VERCEL_AUTOMATION_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS }}
      - name: Upload QA evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-qa-report
          path: test-results/
          retention-days: 14
